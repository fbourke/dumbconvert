# Runs the tests on macOS, Windows and Linux, and the linter, for every pull request and every
# push to main. A pull request shows a green check or a red cross for each.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:                       # a newer push to the same pull request stops the older run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false             # see every platform's result, not just the first failure
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen   # no screen on the build machines
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive    # NegPy lives in vendor/negpy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # NegPy's core is Rust; rustup (already on the build machines) installs the version
      # vendor/negpy/negpy_core/rust-toolchain.toml asks for. The build is cached between runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/negpy/negpy_core

      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ./vendor/negpy/negpy_core
          pip install --no-deps -e ./vendor/negpy

      - name: Tests
        run: python -m unittest discover -s tests -v
